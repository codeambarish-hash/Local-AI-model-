<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Qwen Local AI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0f;
            color: white;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 95%;
            max-width: 900px;
            height: 90vh;

            background: #15151c;

            border: 1px solid #2a2a35;
            border-radius: 20px;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        /* HEADER */

        .header {
            padding: 20px;

            border-bottom: 1px solid #2a2a35;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 20px;
        }

        .status {
            margin-top: 5px;
            font-size: 13px;
            color: #5cff8d;
        }

        /* TOOLBAR */

        .toolbar {
            padding: 12px 15px;

            border-bottom: 1px solid #2a2a35;

            display: flex;
            align-items: center;
            gap: 10px;
        }

        .upload-label {

            background: #2563eb;

            padding: 10px 15px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 14px;
        }

        .upload-label:hover {
            opacity: 0.85;
        }

        #fileInput {
            display: none;
        }

        #fileStatus {

            font-size: 13px;

            color: #aaa;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }

        /* MESSAGES */

        .messages {

            flex: 1;

            overflow-y: auto;

            padding: 25px;
        }

        .message {

            margin-bottom: 20px;

            display: flex;
        }

        .message.user {

            justify-content: flex-end;
        }

        .bubble {

            max-width: 75%;

            padding: 13px 16px;

            border-radius: 15px;

            line-height: 1.5;

            white-space: pre-wrap;
        }

        .user .bubble {

            background: #2563eb;
        }

        .assistant .bubble {

            background: #24242d;
        }

        /* INPUT */

        .input-area {

            padding: 15px;

            border-top: 1px solid #2a2a35;

            display: flex;

            gap: 10px;
        }

        textarea {

            flex: 1;

            resize: none;

            height: 55px;

            background: #20202a;

            color: white;

            border: 1px solid #333340;

            border-radius: 12px;

            padding: 15px;

            outline: none;

            font-size: 15px;
        }

        button {

            border: none;

            border-radius: 12px;

            padding: 0 20px;

            background: #2563eb;

            color: white;

            cursor: pointer;

            font-size: 15px;
        }

        button:hover {

            opacity: 0.85;
        }

        .clear-btn {

            background: #333340;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .chat-container {

                width: 100%;

                height: 100vh;

                border-radius: 0;
            }

            .bubble {

                max-width: 90%;
            }

        }

    </style>

</head>


<body>


<div class="chat-container">


    <!-- HEADER -->

    <div class="header">

        <div>

            <h1>Qwen Local AI</h1>

            <div class="status">
                ● Running locally
            </div>

        </div>


        <button
            class="clear-btn"
            onclick="clearChat()">

            Clear

        </button>

    </div>



    <!-- DOCUMENT UPLOAD -->

    <div class="toolbar">

        <label
            class="upload-label"
            for="fileInput">

            📎 Upload Document

        </label>


        <input
            type="file"
            id="fileInput"
            accept=".pdf,.txt,.docx"
            onchange="uploadFile()">


        <div id="fileStatus">

            No document uploaded

        </div>

    </div>



    <!-- CHAT -->

    <div
        class="messages"
        id="messages">


        <div class="message assistant">

            <div class="bubble">

                Hello! I'm Qwen running locally
                on your computer.

                You can upload a PDF, TXT or DOCX
                and ask me questions about it.

            </div>

        </div>


    </div>



    <!-- INPUT -->

    <div class="input-area">


        <textarea
            id="messageInput"
            placeholder="Message Qwen..."
            onkeydown="handleKey(event)">
        </textarea>


        <button
            onclick="sendMessage()">

            Send

        </button>


    </div>


</div>



<script>


/* SEND MESSAGE */

async function sendMessage() {


    const input =
        document.getElementById(
            "messageInput"
        );


    const message =
        input.value.trim();


    if (!message) {

        return;

    }


    addMessage(
        message,
        "user"
    );


    input.value = "";


    const loading =
        addMessage(
            "Thinking...",
            "assistant"
        );


    try {


        const response =
            await fetch(
                "/chat",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                message

                        })

                }
            );


        const data =
            await response.json();


        loading.querySelector(
            ".bubble"
        ).textContent =
            data.response ||
            data.error;


    }


    catch (error) {


        loading.querySelector(
            ".bubble"
        ).textContent =
            "Error connecting to Qwen.";


    }


    scrollToBottom();

}



/* ADD MESSAGE */

function addMessage(
    text,
    type
) {


    const messages =
        document.getElementById(
            "messages"
        );


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message " + type;


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    bubble.textContent =
        text;


    message.appendChild(
        bubble
    );


    messages.appendChild(
        message
    );


    scrollToBottom();


    return message;

}



/* UPLOAD FILE */

async function uploadFile() {


    const fileInput =
        document.getElementById(
            "fileInput"
        );


    const fileStatus =
        document.getElementById(
            "fileStatus"
        );


    const file =
        fileInput.files[0];


    if (!file) {

        return;

    }


    fileStatus.textContent =
        "Uploading " +
        file.name +
        "...";


    const formData =
        new FormData();


    formData.append(
        "file",
        file
    );


    try {


        const response =
            await fetch(
                "/upload",
                {

                    method: "POST",

                    body:
                        formData

                }
            );


        const data =
            await response.json();


        if (data.error) {


            fileStatus.textContent =
                "❌ " +
                data.error;


            return;

        }


        fileStatus.textContent =
            "✅ " +
            data.filename +
            " loaded (" +
            data.characters +
            " characters)";


        addMessage(

            "Document loaded successfully. "
            + "You can now ask questions about it.",

            "assistant"

        );


    }


    catch (error) {


        fileStatus.textContent =
            "❌ Upload failed.";


    }

}



/* CLEAR CHAT */

async function clearChat() {


    await fetch(
        "/clear",
        {
            method: "POST"
        }
    );


    document.getElementById(
        "messages"
    ).innerHTML = "";


    document.getElementById(
        "fileStatus"
    ).textContent =
        "No document uploaded";


    addMessage(

        "Conversation cleared. "
        + "How can I help you?",

        "assistant"

    );

}



/* SCROLL */

function scrollToBottom() {


    const messages =
        document.getElementById(
            "messages"
        );


    messages.scrollTop =
        messages.scrollHeight;

}



/* ENTER KEY */

function handleKey(event) {


    if (
        event.key === "Enter"
        &&
        !event.shiftKey
    ) {


        event.preventDefault();


        sendMessage();

    }

}


</script>


</body>

</html>
